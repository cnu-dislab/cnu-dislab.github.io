<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- No inline scripts or styles on admin pages: the login token lives in localStorage. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: http: data:; connect-src https://api.dnclab.dev http://127.0.0.1:* http://localhost:*; form-action 'none'; base-uri 'none'">
  <title>Sign in - DIS Lab Admin</title>
  <link rel="icon" type="image/png" href="src/img/cnu_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Rethink+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/admin.css?v=20261125b">
</head>
<body class="admin admin-login" data-admin-page="login">
  <main class="login-main">
    <div class="card login-card">
      <div class="login-brand">
        <img src="src/img/lab_logo.png" width="1280" height="500" alt="Distributed Intelligence &amp; Systems Lab">
      </div>
      <div class="login-body">
        <h1>Admin sign in</h1>
        <p class="panel-lead">Site administration for lab members.</p>
        <div id="loginMessage" class="form-alert" role="alert" hidden></div>
        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="200" required autofocus>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required>
          </div>
          <button type="submit" id="loginSubmit" class="btn btn--solid">Sign in</button>
        </form>
        <a class="login-back" href="index.html">&larr; Back to the lab website</a>
        <noscript><p class="noscript-note">Signing in needs JavaScript.</p></noscript>
      </div>
    </div>
  </main>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/site.js"></script>
  <script src="assets/js/admin.js?v=20261125b"></script>
  <script src="assets/js/admin-pages.js?v=20261125b"></script>
</body>
</html>
